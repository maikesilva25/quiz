<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="item-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Login Administrativo</h2>
            <form id="loginForm">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px;">Email</label>
                    <input type="email" id="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px;">Senha</label>
                    <input type="password" id="password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
            <div id="errorMsg" style="color: #FF3B30; margin-top: 16px; text-align: center; display: none;"></div>
        </div>
    </div>

    <script>
        // Aguardar o Firebase carregar
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');
                
                // Verificar se auth está disponível
                const authInstance = window.auth || auth;
                const dbInstance = window.db || db;
                
                if (typeof authInstance === 'undefined' || typeof dbInstance === 'undefined') {
                    errorMsg.textContent = 'Erro: Firebase não carregou corretamente. Recarregue a página.';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                try {
                    const userCredential = await authInstance.signInWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    
                    // Verificar se é admin
                    const userDoc = await dbInstance.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        await authInstance.signOut();
                        errorMsg.innerHTML = 'Erro: Seu perfil não foi encontrado no sistema.<br><br>' +
                            'Entre em contato com um administrador para criar seu perfil.';
                        errorMsg.style.display = 'block';
                        return;
                    }
                    
                    const userData = userDoc.data();
                    console.log('Login - Dados do usuário:', userData);
                    console.log('Login - isAdmin:', userData?.isAdmin, 'tipo:', typeof userData?.isAdmin);
                    
                    // Verificação estrita: isAdmin deve ser exatamente true
                    if (userData && userData.isAdmin === true) {
                        console.log('Login - Usuário é admin, redirecionando...');
                        window.location.href = 'index.html';
                    } else {
                        await authInstance.signOut();
                        const debugInfo = `UID: ${user.uid}<br>Email: ${user.email}<br>isAdmin: ${userData?.isAdmin || 'não definido'}`;
                        errorMsg.innerHTML = 'Acesso negado. Você não é um administrador.<br><br>' +
                            '<strong>Para resolver:</strong><br>' +
                            '1. Acesse o Firestore Console<br>' +
                            '2. Vá para a coleção "users"<br>' +
                            '3. Encontre o documento com ID: ' + user.uid + '<br>' +
                            '4. Defina o campo "isAdmin" como "true" (boolean)<br><br>' +
                            '<small>' + debugInfo + '</small><br><br>' +
                            '<a href="make-admin.html" style="color: #007AFF; text-decoration: underline;">' +
                            'Clique aqui para marcar um usuário como admin</a>';
                        errorMsg.style.display = 'block';
                    }
                } catch (error) {
                    errorMsg.textContent = 'Erro ao fazer login: ' + error.message;
                    errorMsg.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
